name: Flutter Build

on:
    workflow_dispatch

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
            distribution: temurin
            java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml 
          cache: true
          pub-cache: true
            
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - run: flutter pub get

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/decibel-prod.keystore

      - name: Build APK
        env:
          KEYSTORE_PATH: "decibel-prod.keystore"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: decibel-android-release
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 1
          
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml 
          cache: true
          pub-cache: true
          
      - run: flutter pub get
      
      - name: Build Windows Desktop App
        run: flutter build windows --release
                  
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: decibel-windows-release
          path: build\windows\x64\runner\Release\
          retention-days: 1