name: Flutter Build

on:
    workflow_dispatch:
      inputs:
        action:
          description: 'Build target platform'
          required: true
          default: 'android'
          type: choice
          options:
            - android
            - windows

jobs:
  build-android:
    if: ${{ github.event.inputs.action == 'android' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
            distribution: temurin
            java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml 
          cache: true
          pub-cache: true
            
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5

      - run: flutter pub get
      
      - name: Build APK
        run: flutter build apk --release --split-per-abi --obfuscate --split-debug-info=build/debug-info

      - name: Upload Android APK
        uses: actions/upload-artifact@v6
        with:
          name: decibel-android-release
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 1
          
  build-windows:
    if: ${{ github.event.inputs.action == 'windows' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version-file: pubspec.yaml 
          cache: true
          pub-cache: true
          
      - run: flutter pub get
      
      - name: Build Windows Desktop App
        run: flutter build windows --release
                  
      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: decibel-windows-release
          path: build\windows\x64\runner\Release\
          retention-days: 1