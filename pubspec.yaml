name: decibel
description: "Decibel – A SoundCloud-inspired audio streaming app."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.10.8

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # ---------- State Management ----------
  flutter_riverpod: ^2.6.1

  # ---------- Routing & Navigation ----------
  go_router: ^14.8.1

  # ---------- Dependency Injection ----------
  get_it: ^8.0.3
  injectable: ^2.5.0

  # ---------- Networking ----------
  dio: ^5.7.0
  web_socket_channel: ^3.0.2

  # ---------- Data Modeling ----------
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  dartz: ^0.10.1

  # ---------- Secure Storage (JWT / OAuth tokens) ----------
  flutter_secure_storage: ^9.2.4

  # ---------- Local Storage ----------
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.5.3

  # ---------- Audio Playback ----------
  just_audio: ^0.9.43

  # ---------- Waveform Visualization ----------
  audio_waveforms: ^1.2.0

  # ---------- Media & File Selection ----------
  image_picker: ^1.1.2
  file_picker: ^8.1.7
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  desktop_webview_auth: ^0.0.16
  google_sign_in: ^7.2.0
  window_manager: ^0.5.1
  responsive_framework: ^1.5.1
  device_info_plus: ^12.3.0


  # ---------- Social Icons ----------
  font_awesome_flutter: ^10.7.0
  # ---------- Google Sign In ----------

dev_dependencies:
  flutter_test:
    sdk: flutter

  # ---------- Linting ----------
  flutter_lints: ^6.0.0

  # ---------- Code Generation ----------
  build_runner: ^2.4.14
  freezed: ^2.5.8
  json_serializable: ^6.9.4
  injectable_generator: ^2.6.3

  # ---------- App Icon Generator ----------
  flutter_launcher_icons: ^0.14.3
  mocktail: ^1.0.4

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
    - assets/icon/black_app_icon_trans.png
    - assets/icon/white_app_icon_trans.png
    - assets/background/background_startscreen.png
    - assets/background/foreground_startscreen.png
    - assets/background/desktop/background_startscreen.png
    - assets/background/desktop/foreground_startscreen.png

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
  #       - asset: fonts/Schyler-Italic.ttf
  #         style: italic
  #   - family: Trajan Pro
  #     fonts:
  #       - asset: fonts/TrajanPro.ttf
  #       - asset: fonts/TrajanPro_Bold.ttf
  #         weight: 700
  #
  # For details regarding fonts from package dependencies,
  # see https://flutter.dev/to/font-from-package

# ---------- Launcher Icons Configuration ----------
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#F9F5F0"
    theme_color: "#E8845C"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 48
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#F9F5F0"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21
  remove_alpha_ios: true
